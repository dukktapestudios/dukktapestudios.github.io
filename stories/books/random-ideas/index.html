<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Ideas | Dukktape Studios</title>
<meta name="description" content="A list of story ideas. Each entry has a title, where it stands, a date, and a premise.">
<link rel="preload" href="../../../assets/fonts/nunito-latin-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../stories.css">
<style>
  .ideas-page main {
    width: min(760px, 100%);
    margin: 0 auto;
  }

  .ideas-page h1 {
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-size: clamp(1.7rem, 4vw, 2.2rem);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  .lede {
    margin: 2px 2px 16px;
    color: var(--ink-soft);
    font-weight: 700;
  }

  .idea-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .idea {
    margin: 0;
    padding: 14px 14px 16px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 8px 18px rgba(92, 58, 28, .06);
  }

  .idea h2 {
    margin: 0 0 8px;
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-size: clamp(1.28rem, 2vw, 1.55rem);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin: 0 0 10px;
  }

  .status {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 2px 10px;
    border-radius: 999px;
    background: #f3e0cc;
    color: var(--ember-deep);
    font-size: .85rem;
    font-weight: 800;
  }

  .status.ready {
    background: #e3f0e6;
    color: var(--pine-deep);
  }

  .type-tag {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    background: #e4eaf3;
    color: #243e66;
    font-size: .75rem;
    font-weight: 800;
    letter-spacing: .03em;
  }

  .meta time {
    color: var(--ink-soft);
    font-size: .95rem;
    font-weight: 800;
  }

  .premise {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.55;
  }

  .notice {
    margin: 0;
    padding: 14px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    font-weight: 800;
  }

  @media (max-width: 560px) {
    .idea { padding: 13px 12px 15px; }
  }
</style>
<link rel="stylesheet" href="../../../assets/donate-bar.css">
</head>
<body class="ideas-page">
<aside class="dts-donate" aria-label="Donations">
<p class="dts-donate-line">Free to use. Donations welcome — they keep this going.</p>
<a class="dts-donate-link" href="https://www.paypal.com/cgi-bin/webscr?cmd=_donations&amp;business=ducttapestudios%40gmail.com&amp;item_name=Dukktape%20Studios&amp;currency_code=USD">Donate</a>
</aside>

<a class="skip" href="#ideas">Skip to ideas</a>
<header class="mast">
  <p class="home-link"><a href="../../">← Back to bookshelf</a></p>
  <h1>Random Ideas</h1>
</header>
<main>
  <!--
    Ideas are loaded from data/ideas.json.
    To add one, append an object to the "ideas" array:
      { "title": "...", "type": "Anime", "status": "idea only", "date": "YYYY-MM-DD", "premise": "..." }
    See README.md in this folder.
  -->
  <p class="lede">Stories that are not books yet.</p>
  <noscript><p class="notice">The idea list needs JavaScript to load.</p></noscript>
  <ul class="idea-list" id="ideas"></ul>
</main>
<footer>
  <p>© 2026 Dukktape Studios</p>
</footer>
<script>
(function () {
  var list = document.getElementById("ideas");
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function formatDate(value) {
    var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(typeof value === "string" ? value.trim() : "");
    if (!match) return typeof value === "string" ? value.trim() : "";
    var month = MONTHS[Number(match[2]) - 1];
    if (!month) return value.trim();
    return month + " " + Number(match[3]) + ", " + match[1];
  }

  function notice(text) {
    list.replaceChildren(el("li", "notice", text));
  }

  function render(ideas) {
    list.replaceChildren();
    ideas.forEach(function (idea) {
      var item = el("li", "idea");
      item.appendChild(el("h2", "", idea.title));
      var meta = el("p", "meta");
      if (idea.type) meta.appendChild(el("span", "type-tag", idea.type));
      if (idea.status) {
        var ready = /made|draft|comic|done|published/i.test(idea.status);
        meta.appendChild(el("span", ready ? "status ready" : "status", idea.status));
      }
      if (idea.date) {
        var time = el("time", "", formatDate(idea.date));
        if (/^\d{4}-\d{2}-\d{2}$/.test(idea.date)) time.setAttribute("datetime", idea.date);
        meta.appendChild(time);
      }
      if (meta.childNodes.length) item.appendChild(meta);
      item.appendChild(el("p", "premise", idea.premise));
      list.appendChild(item);
    });
  }

  fetch("data/ideas.json", { headers: { "Accept": "application/json" } })
    .then(function (response) {
      if (!response.ok) throw new Error("status");
      return response.json();
    })
    .then(function (data) {
      var ideas = data && Array.isArray(data.ideas) ? data.ideas : [];
      ideas = ideas.filter(function (idea) {
        return idea &&
          typeof idea.title === "string" && idea.title.trim() &&
          typeof idea.premise === "string" && idea.premise.trim();
      }).map(function (idea) {
        return {
          title: idea.title.trim(),
          premise: idea.premise.trim(),
          status: typeof idea.status === "string" ? idea.status.trim() : "",
          date: typeof idea.date === "string" ? idea.date.trim() : "",
          type: typeof idea.type === "string" ? idea.type.trim() : ""
        };
      });
      if (!ideas.length) {
        notice("No ideas yet.");
        return;
      }
      render(ideas);
    })
    .catch(function () {
      notice("These ideas could not be loaded.");
    });
})();
</script>
<script data-goatcounter="https://dukktape.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
