<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOIA Made Easy</title><style>
body{font-family:system-ui,sans-serif;font-size:19px;max-width:760px;margin:auto;padding:16px;background:#f6f7f9;color:#111;line-height:1.5}
h1{font-size:30px;margin:.2em 0}label{display:block;font-weight:600;margin-top:14px}
textarea,input,select{width:100%;box-sizing:border-box;font-size:19px;padding:10px;border:1px solid #aaa;border-radius:8px}
textarea{min-height:150px}.row{display:flex;gap:10px}.row>div{flex:1}
button{font-size:21px;padding:14px 22px;border:0;border-radius:10px;background:#1f5fbf;color:#fff;margin-top:18px;cursor:pointer}
.card{background:#fff;border-radius:12px;padding:16px;margin-top:18px;box-shadow:0 1px 4px #0002}
pre{white-space:pre-wrap;font-family:inherit;background:#f0f3f8;padding:12px;border-radius:8px}
.warn{background:#fff4d6;border-left:6px solid #e0a400;padding:8px 12px;margin:8px 0;border-radius:6px}
.ok{background:#e4f6e8;border-left:6px solid #2a9d4b;padding:8px 12px;border-radius:6px}a{color:#1f5fbf}
</style><link rel="stylesheet" href="../assets/donate-bar.css">
</head><body>

<h1>FOIA Made Easy</h1><p>Type what records you want. Nothing leaves this page; it works offline.</p>
<label for="want">What records do you want?</label>
<textarea id="want" placeholder="Example: Number of election judges by party for each precinct, Jan 1 – Mar 31, 2026. Counts only, no names."></textarea>
<label for="gov">Which government has the records?</label>
<select id="gov"><option value="local">State or local government (city, county, state agency, school)</option><option value="fed">Federal (U.S. government)</option></select>
<label for="st">Which state? (for state/local)</label><select id="st"><option>Alabama</option><option>Alaska</option><option>Arizona</option><option>Arkansas</option><option>California</option><option>Colorado</option><option>Connecticut</option><option>Delaware</option><option>Florida</option><option>Georgia</option><option>Hawaii</option><option>Idaho</option><option>Illinois</option><option>Indiana</option><option>Iowa</option><option>Kansas</option><option>Kentucky</option><option>Louisiana</option><option>Maine</option><option>Maryland</option><option>Massachusetts</option><option>Michigan</option><option>Minnesota</option><option>Mississippi</option><option>Missouri</option><option>Montana</option><option>Nebraska</option><option>Nevada</option><option>New Hampshire</option><option>New Jersey</option><option>New Mexico</option><option>New York</option><option>North Carolina</option><option>North Dakota</option><option>Ohio</option><option>Oklahoma</option><option>Oregon</option><option>Pennsylvania</option><option>Rhode Island</option><option>South Carolina</option><option>South Dakota</option><option>Tennessee</option><option>Texas</option><option>Utah</option><option>Vermont</option><option>Virginia</option><option>Washington</option><option>West Virginia</option><option>Wisconsin</option><option>Wyoming</option></select>
<label for="agency">Agency name (if you know it)</label><input id="agency" placeholder="Example: Springfield City Clerk">
<label for="dates">Date range</label><input id="dates" placeholder="Example: Jan 1 – Mar 31, 2026">
<div class="row"><div><label for="name">Your name</label><input id="name"></div><div><label for="contact">Your email or address</label><input id="contact"></div></div>
<button onclick="make()">Make my request</button>
<div id="out"></div>
<script>
const S={"Alabama": ["Alabama Open Records Act", "Ala. Code 36-12-44", "Acknowledge within 10 business days, then fulfill or deny within 15 business days after acknowledging; may extend in 15-business-day increments with written notice", "https://alison.legislature.state.al.us/code-of-alabama?section=36-12-44"], "Alaska": ["Alaska Public Records Act", "2 AAC 96.325", "10 working days; up to 10 more with written notice", "https://law.alaska.gov/doclibrary/APRA.html"], "Arizona": ["Arizona Public Records Law", "A.R.S. 39-121.01", "No fixed deadline. Must respond promptly", "https://azleg.gov/ars/39/00121-01.htm"], "Arkansas": ["Arkansas Freedom of Information Act", "Ark. Code 25-19-105", "Immediately; if in active use or storage, the custodian must certify that in writing and set a time within 3 working days", "https://arkansasag.gov/divisions/opinions-foia/arkansas-freedom-of-information-act/"], "California": ["California Public Records Act", "Gov. Code 7922.535", "10 days to decide whether records will be released; up to 14 more in unusual circumstances", "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=7922.535"], "Colorado": ["Colorado Open Records Act", "C.R.S. 24-72-203", "Presumed 3 working days; up to 7 more working days for extenuating circumstances (written notice within the 3 days)", "https://dpa.colorado.gov/dpa-executive-directors-office/communications/colorado-open-records-act-cora"], "Connecticut": ["Connecticut Freedom of Information Act", "Conn. Gen. Stat. 1-206, 1-210", "No fixed deadline (promptly); a denial must be in writing within 4 business days", "https://portal.ct.gov/foi/regulations/the-foi-act/section-1206-formerly-sec-121i--denial-of-access-to-public-records-or-meetings--appeals--notice--ord"], "Delaware": ["Delaware Freedom of Information Act", "29 Del. C. 10003(h)", "15 business days to provide, deny, or explain why more time is needed", "https://delcode.delaware.gov/title29/c100/"], "Florida": ["Florida Public Records Law", "Fla. Stat. 119.07", "No fixed deadline. Prompt, good-faith response", "https://www.myfloridalegal.com/open-government/frequently-asked-questions"], "Georgia": ["Georgia Open Records Act", "O.C.G.A. 50-18-71", "3 business days (if not ready, a description and timeline within 3 business days)", "https://law.georgia.gov/key-issues/open-government/faq-open-government"], "Hawaii": ["Hawaii Uniform Information Practices Act (Modified)", "HAR 2-71-13, 2-71-15", "10 business days (agency may acknowledge and take up to 20 business days in extenuating circumstances)", "https://ags.hawaii.gov/oip/rules/quick-guide-to-oips-administrative-rules/"], "Idaho": ["Idaho Public Records Act", "Idaho Code 74-103", "3 working days; if more time is needed, written notice and records within 10 working days", "https://legislature.idaho.gov/statutesrules/idstat/title74/t74ch1/sect74-103/"], "Illinois": ["Illinois Freedom of Information Act", "5 ILCS 140/3", "5 business days; may extend 5 more business days with written notice. No answer counts as a denial", "https://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=000501400K3"], "Indiana": ["Indiana Access to Public Records Act", "IC 5-14-3-9", "Acknowledge within 24 hours (in person/phone) or 7 days (mail/email/fax); records within a reasonable time after that", "https://faqs.in.gov/hc/en-us/articles/115005226148-How-long-does-the-agency-have-to-give-me-the-records-I-requested"], "Iowa": ["Iowa Open Records Law (Iowa Code ch. 22)", "Iowa Code 22.8(4)", "No fixed deadline. Records promptly; delay to decide confidentiality may not exceed 20 calendar days", "https://ipib.iowa.gov/time-frame-fulfill-request"], "Kansas": ["Kansas Open Records Act", "K.S.A. 45-218(d)", "End of the 3rd business day; longer with written explanation", "https://www.ksrevisor.gov/statutes/chapters/ch45/045_002_0018.html"], "Kentucky": ["Kentucky Open Records Act", "KRS 61.880, 61.872(5)", "5 business days; longer with detailed explanation", "https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=51394"], "Louisiana": ["Louisiana Public Records Law", "La. R.S. 44:33", "Immediately; if in active use, a set date within 3 business days", "https://legis.la.gov/Legis/Law.aspx?d=99701"], "Maine": ["Maine Freedom of Access Act", "1 M.R.S. 408-A", "Acknowledge within 5 working days, then records by a good-faith estimated date", "https://legislature.maine.gov/legis/statutes/1/title1sec408-A.html"], "Maryland": ["Maryland Public Information Act", "Gen. Prov. 4-203", "Promptly, no more than 30 days; if over 10 working days, notice within 10 working days; 30 more days only with your consent", "https://mgaleg.maryland.gov/mgawebsite/Laws/StatuteText?article=ggp&section=4-203"], "Massachusetts": ["Massachusetts Public Records Law", "M.G.L. c. 66, s. 10", "10 business days to provide or explain in writing", "https://www.sec.state.ma.us/divisions/public-records/public-records-law/public-records-request.htm"], "Michigan": ["Michigan Freedom of Information Act", "MCL 15.235", "5 business days; one extension up to 10 business days", "https://www.legislature.mi.gov/Laws/MCL?objectName=mcl-15-235"], "Minnesota": ["Minnesota Government Data Practices Act", "Minn. Stat. 13.03", "No fixed deadline. Prompt; copies as soon as reasonably possible", "https://www.revisor.mn.gov/statutes/cite/13.03"], "Mississippi": ["Mississippi Public Records Act", "Miss. Code 25-61-5", "7 working days; up to 14 with written explanation", "https://www.ethics.ms.gov/thepublicrecordact"], "Missouri": ["Missouri Sunshine Law", "RSMo 610.023", "End of the 3rd business day; longer with detailed explanation", "https://revisor.mo.gov/main/OneSection.aspx?section=610.023"], "Montana": ["Montana public information request law", "MCA 2-6-1006", "State agencies: acknowledge within 5 business days; records within 90 days of acknowledgment (up to 6 months with written notice). Local governments: no fixed deadline", "https://mca.legmt.gov/bills/MCA/title_0020/chapter_0060/part_0100/section_0060/0020-0060-0100-0060.html"], "Nebraska": ["Nebraska Public Records Statutes", "Neb. Rev. Stat. 84-712", "4 business days; longer with written explanation", "https://nebraskalegislature.gov/laws/statutes.php?statute=84-712"], "Nevada": ["Nevada Public Records Act", "NRS 239.0107", "5 business days; longer with written notice", "https://www.leg.state.nv.us/nrs/nrs-239.html"], "New Hampshire": ["New Hampshire Right-to-Know Law", "RSA 91-A:4", "Immediately if available, otherwise 5 business days", "https://www.gc.nh.gov/rsa/html/VI/91-A/91-A-4.htm"], "New Jersey": ["New Jersey Open Public Records Act", "N.J.S.A. 47:1A-5(i)", "7 business days (14 for commercial or Daniel's Law requests). No answer counts as a denial", "https://www.nj.gov/grc/public/complaints/time.html"], "New Mexico": ["New Mexico Inspection of Public Records Act", "NMSA 14-2-8, 14-2-10", "No later than 15 calendar days; written explanation within 3 business days if not immediate", "https://www.nmag.gov/wp-content/uploads/2021/11/Inspection-of-Public-Records-Compliance-Guide-2015-Edit.pdf"], "New York": ["New York Freedom of Information Law", "Public Officers Law 89(3)(a)", "5 business days to provide, deny, or acknowledge with an approximate date (generally within 20 business days)", "https://www.law.cornell.edu/regulations/new-york/21-NYCRR-1401.5"], "North Carolina": ["North Carolina Public Records Act", "N.C.G.S. 132-6", "No fixed deadline. As promptly as possible", "https://www.ncleg.gov/enactedlegislation/statutes/html/bysection/chapter_132/gs_132-6.html"], "North Dakota": ["North Dakota Open Records Law", "N.D.C.C. 44-04-18", "No fixed deadline. Must respond within a reasonable time", "https://attorneygeneral.nd.gov/open-records-meetings/requesting-public-records/"], "Ohio": ["Ohio Public Records Act", "R.C. 149.43(B)(1)", "No fixed deadline. Promptly for inspection, reasonable time for copies", "https://www.ohioattorneygeneral.gov/Legal/Sunshine-Laws/Public-Records-Act"], "Oklahoma": ["Oklahoma Open Records Act", "51 O.S. 24A.5", "No fixed deadline. Prompt, reasonable access", "https://www.oscn.net/applications/oscn/DeliverDocument.asp?CiteID=80292"], "Oregon": ["Oregon Public Records Law", "ORS 192.329", "Acknowledge within 5 business days; complete or give a status update with an estimate within 10 more business days", "https://www.oregonlegislature.gov/bills_laws/ors/ors192.html"], "Pennsylvania": ["Pennsylvania Right-to-Know Law", "65 P.S. 67.901, 67.902", "5 business days (no answer counts as a denial); one extension of up to 30 calendar days with written notice", "https://openrecords.pa.gov/Documents/RTKL/PA_Right-To-Know_Law.pdf"], "Rhode Island": ["Rhode Island Access to Public Records Act", "R.I. Gen. Laws 38-2-3(e)", "10 business days; up to 20 more business days with a written, specific reason", "https://webserver.rilegislature.gov/statutes/title38/38-2/38-2-3.HTM"], "South Carolina": ["South Carolina Freedom of Information Act", "S.C. Code 30-4-30(C)", "10 business days to decide (20 if records are over 24 months old); then 30 calendar days to produce (35 for older records)", "https://www.scstatehouse.gov/code/t30c004.php"], "South Dakota": ["South Dakota Public Records Law", "SDCL 1-27-37", "10 business days after a written request to provide, deny, or give a time estimate", "https://sdlegislature.gov/Statutes/1-27-37"], "Tennessee": ["Tennessee Public Records Act", "T.C.A. 10-7-503", "Promptly; if not practicable, within 7 business days provide, deny in writing, or state the time needed", "https://comptroller.tn.gov/office-functions/open-records-counsel/open-meetings/frequently-asked-questions/tennessee-public-records-act-faqs.html"], "Texas": ["Texas Public Information Act", "Gov't Code 552.221", "Promptly; if over 10 business days, must certify in writing and set a release date", "https://www.texasattorneygeneral.gov/open-government/members-public/overview-public-information-act"], "Utah": ["Utah Government Records Access and Management Act (GRAMA)", "Utah Code 63G-2-204", "10 business days (5 if expedited for public benefit)", "https://le.utah.gov/xcode/Title63G/Chapter2/C63G-2-S204_2023050320230503.html"], "Vermont": ["Vermont Public Records Act", "1 V.S.A. 318", "3 business days; up to 10 business days from receipt in unusual circumstances, with written notice", "https://legislature.vermont.gov/statutes/section/01/005/00318"], "Virginia": ["Virginia Freedom of Information Act", "Va. Code 2.2-3704(B)", "5 working days; 7 more working days if the body says in time that it can't respond yet", "https://law.lis.virginia.gov/vacode/title2.2/section2.2-3704/"], "Washington": ["Washington Public Records Act", "RCW 42.56.520", "5 business days to provide records or acknowledge with a reasonable time estimate", "https://app.leg.wa.gov/RCW/default.aspx?cite=42.56.520"], "West Virginia": ["West Virginia Freedom of Information Act", "W. Va. Code 29B-1-3", "As soon as practicable, no later than 5 days (excluding weekends and legal holidays)", "https://code.wvlegislature.gov/29B-1-3/"], "Wisconsin": ["Wisconsin Public Records Law", "Wis. Stat. 19.35(4)(a)", "No fixed deadline. As soon as practicable and without delay", "https://docs.legis.wisconsin.gov/statutes/statutes/19/II/35"], "Wyoming": ["Wyoming Public Records Act", "Wyo. Stat. 16-4-202", "Records no later than 30 calendar days after the agency acknowledges your request, unless good cause; then a mutually agreed date", "https://wyoleg.gov/NXT/gateway.dll/2026%20Wyoming%20Statutes/2026%20Titles/862/869/871?f=templates&fn=document-frameset.htm"]};
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function make(){
const v=id=>document.getElementById(id).value.trim();
const want=v('want')||'[describe the records]',gov=v('gov'),dates=v('dates'),name=v('name')||'[your name]',contact=v('contact')||'[your email or mailing address]';
let agency=v('agency');const today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
let law,where,steps;
if(gov==='fed'){law='the Freedom of Information Act, 5 U.S.C. § 552';agency=agency||'[Agency] FOIA Office';
where=`<p>Find the agency and its FOIA office at <a href="https://www.foia.gov/">foia.gov</a>. Many agencies take requests online there.</p><p>Federal agencies must decide within <b>20 business days</b> (up to 10 more in unusual circumstances). <a href="https://www.law.cornell.edu/uscode/text/5/552">Source (5 U.S.C. 552(a)(6))</a></p>`;}
else{const st=v('st'),d=S[st];law=d?`the ${d[0]} (${d[1]})`:`the ${st} public records law`;agency=agency||'[Agency] Records Officer';
where=`<p>Send it to the agency's <b>public records / FOIA officer</b> (usually listed on its website). Email is fine.</p>`+(d?`<p><b>${st} deadline:</b> ${d[2]}. <a href="${d[3]}">Source</a></p><p style="font-size:15px;color:#555">Laws change and deadlines can differ for commercial or large requests. Check the current statute (${d[1]}).</p>`:'');
if(st==='Illinois')where+=`<p>Denied or no answer? You can ask the Illinois Attorney General's <b>Public Access Counselor</b> to review it within <b>60 days</b> of the denial: email public.access@ilag.gov with your request and their reply. <a href="https://www.illinoisattorneygeneral.gov/Open-and-Honest-Government/PAC/">PAC website</a> · <a href="https://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=000501400K9.5">Source (5 ILCS 140/9.5)</a></p>`;
else where+=`<p>Denied? Most states let you appeal to the agency head, the state Attorney General or an ombudsman, or court. Check your state's rules.</p>`;}
const letter=`${today}

To: ${agency}
Re: Records request under ${law}

Dear Records Officer,

Under ${law}, I request copies of the following records:

${want}${dates?`

Time period: ${dates}`:''}

I prefer electronic copies (PDF or spreadsheet) sent by email. If any part is withheld, please release the rest and tell me the specific exemption used for each part withheld. I request a waiver or reduction of fees because this information is in the public interest and not for commercial use. If fees will be more than $25, please tell me before processing.

Thank you,
${name}
${contact}`;
const t=want.toLowerCase();let notes=[];
if(/\b(why|explain|opinion|answer|tell me|what do you think)\b/.test(t))notes.push('FOIA gets <b>existing records</b>, not answers or opinions. Ask for the documents (emails, lists, reports) that would show the answer.');
if(/\b(create|compile|make a list|calculate|analy)/.test(t))notes.push('Agencies usually don\'t have to <b>create new records</b> or analysis. Ask for records they already keep.');
if(/\b(ssn|social security|medical|health|birth ?date|home address|phone number|password)/.test(t))notes.push('<b>Private personal info</b> (SSNs, medical records, home addresses, etc.) is exempt and will be blacked out or withheld.');
if(/\b(how .* voted|who .* voted for|ballot|voted for)/.test(t))notes.push('<b>Ballots are secret.</b> No record shows who a person voted for. Voter files at most show <i>whether</i> someone voted, and access is often limited.');
if(/\b(police|investigation|arrest)/.test(t))notes.push('Records about open investigations may be withheld for now.');
const poss=notes.length?notes.map(n=>`<div class="warn">${n}</div>`).join(''):'<div class="ok">Looks like a normal request for existing records — likely possible. Some parts may still be withheld under exemptions.</div>';
document.getElementById('out').innerHTML=`
<div class="card"><h2>1. Your request letter</h2><pre id="letter">${esc(letter)}</pre><button onclick="navigator.clipboard.writeText(document.getElementById('letter').innerText).then(()=>this.textContent='Copied!')">Copy letter</button></div>
<div class="card"><h2>2. Where to send it</h2>${where}</div>
<div class="card"><h2>3. Steps</h2><ol><li>Fill in any [brackets], then email or mail the letter.</li><li>Keep a copy and note the date you sent it.</li><li>Mark the deadline on your calendar.</li><li>No answer or a denial? Ask for the reason in writing, then appeal (Illinois: Public Access Counselor; federal: the agency's appeal office, then <a href="https://www.archives.gov/ogis">OGIS</a>).</li></ol></div>
<div class="card"><h2>4. Tips to get a yes</h2><ul><li><b>Be specific:</b> dates, record types (emails, logs, contracts, lists), names of offices, keywords.</li><li>Ask for <b>records that already exist</b>, not questions or new reports.</li><li>Ask for <b>electronic copies</b> and a <b>fee waiver</b> (already in the letter).</li><li><b>Cite the law</b> (done in the letter).</li><li>Ask for <b>partial release</b> if parts are exempt (done in the letter).</li><li>Keep a <b>dated copy</b> of what you sent and every reply.</li><li>If denied, get the reason in writing and <b>appeal</b> on time.</li></ul></div>
<div class="card"><h2>5. Is this possible?</h2>${poss}<p style="font-size:15px;color:#555">General info, not legal advice.</p></div>`;
document.getElementById('out').scrollIntoView({behavior:'smooth'});}
</script><script data-goatcounter="https://dukktape.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
